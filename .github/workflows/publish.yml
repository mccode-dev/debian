name: publish

# Adds the .deb packages of McCode releases (the {mcstas,mcxtrace}-debian-*.tgz
# assets that the McCode autobuild attaches to each release) to the flat apt
# repository kept as assets of the "apt" release of this repo, then re-signs
# the index. Scheduled runs pick up any published release not in the index yet.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: McCode release tags to add (space separated, empty = all new releases)
        required: false
        default: ''
      force:
        description: Re-sign and run the install test even if nothing was added
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.add.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      TAGS: ${{ inputs.tags }}
    steps:
      - uses: actions/checkout@v6

      - name: Import signing key
        run: echo "${{ secrets.APT_GPG_KEY }}" | gpg --batch --import

      - name: Add packages
        id: add
        run: |
          set -eu
          gh release view apt -R $R > /dev/null 2>&1 || gh release create apt -R $R \
            --title "apt repository" --notes "Flat apt repository, see https://mccode-dev.github.io/debian/"
          # Index and upload the .debs in new/ that are not published yet. Asset
          # names are unique per version and arch, so a known Filename is done.
          add_new() {
            for d in new/*.deb; do
              grep -qx "Filename: ./${d#new/}" Packages && rm $d || true
            done
            if ls new/*.deb > /dev/null 2>&1; then
              echo "$1: $(ls new | wc -l) new packages"
              CHANGED=true
              dpkg-scanpackages --multiversion new /dev/null | sed 's#^Filename: new/#Filename: ./#' >> Packages
              gh release upload apt -R $R --clobber new/*.deb
            fi
            rm -rf new
          }
          CHANGED=${{ inputs.force || false }}
          mkdir repo && cd repo
          gh release download apt -R $R -p Packages || touch Packages
          if [ -z "$TAGS" ]; then
            # newest published releases whose amd64+arm64 debs of both flavors are attached
            for tag in $(gh release list -R mccode-dev/McCode --exclude-drafts --exclude-pre-releases -L 5 --json tagName -q '.[].tagName'); do
              grep -qx "Filename: ./mcstas-${tag#v}-deb64.deb" Packages && continue
              n=$(gh release view $tag -R mccode-dev/McCode --json assets -q '[.assets[].name|select(test("^(mcstas|mcxtrace)-debian-(x86_64|arm64)\\.tgz$"))]|length')
              [ "$n" = 4 ] && TAGS="$TAGS $tag" || echo "$tag: $n/4 debian archives attached so far, skipping"
            done
          fi
          echo "releases to add: ${TAGS:-none}"
          for tag in $TAGS; do
            for flavor in mcstas mcxtrace; do
              gh release download $tag -R mccode-dev/McCode -p "$flavor-debian-*.tgz" -D ../dl
              mkdir -p new
              for t in ../dl/*.tgz; do tar xzf $t -C new --strip-components=1 --wildcards '*.deb'; done
              rm -rf ../dl
              add_new "$flavor $tag"
            done
          done
          # cif2hkl (>= 1.5.1 needed by the -comps packages; Ubuntu lags behind):
          # the .debs of the latest SOLEIL release, linked from its release text
          mkdir -p new
          P=https://gitlab.com/api/v4/projects/21820312
          for u in $(curl -fsSL $P/releases | jq -r '.[0].description' | grep -oE '/uploads/[0-9a-f]+/[^)]+\.deb'); do
            curl -fsSL -o new/$(basename $u) https://gitlab.com/-/project/21820312$u
          done
          ls new/*.deb > /dev/null  # fail loudly if the release text changed shape
          add_new cif2hkl
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Sign and upload index
        if: steps.add.outputs.changed == 'true'
        working-directory: repo
        run: |
          set -eu
          sudo apt-get install -y -qq apt-utils > /dev/null  # apt-ftparchive
          gzip -9kf Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=McCode -o APT::FTPArchive::Release::Label=McCode \
            -o APT::FTPArchive::Release::Description="McStas and McXtrace packages" release . > Release
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes -abs -o Release.gpg Release
          gh release upload apt -R $R --clobber Packages Packages.gz Release InRelease Release.gpg
          grep -c '^Package:' Packages | xargs echo "packages in index:"

  # Install check on both architectures, as a user would set it up
  test:
    needs: publish
    if: needs.publish.outputs.changed == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          set -eux
          sudo -E wget -O /usr/share/keyrings/mccode-apt.gpg https://mccode-dev.github.io/debian/mccode-apt.gpg
          sudo rm -f /etc/apt/sources.list.d/mccode.list   # older one-line format, replaced by mccode.sources
          sudo -E wget -O /etc/apt/sources.list.d/mccode.sources https://mccode-dev.github.io/debian/mccode.sources
          sudo apt-get update
          apt-cache policy mcstas mcxtrace
          sudo apt-get install -y mcstas-suite-python mcxtrace-suite-python
          ls /usr/bin | grep -E '^(mc|mx)' | head -20
          mcstas --version; mcxtrace --version
